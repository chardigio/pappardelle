name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  bun-tests:
    name: Bun Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify application tooling does not invoke Node
        run: |
          mkdir -p "$RUNNER_TEMP/no-node"
          cat > "$RUNNER_TEMP/no-node/node" <<'SH'
          #!/bin/sh
          echo "Pappardelle must use Bun, not Node" >&2
          exit 1
          SH
          chmod +x "$RUNNER_TEMP/no-node/node"
          echo "$RUNNER_TEMP/no-node" >> "$GITHUB_PATH"

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Install terminal test tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y tmux shellcheck
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install terminal test tools (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux shellcheck yq

      # Formatting and lint are checked here, not just in the monorepo, because
      # sync-back pushes a merged PR's diff *directly to monorepo master* — no
      # PR, no gate. When this workflow only ran ava, a chardigio-side PR could
      # (and did, in #5) land a prettier violation straight onto a red master
      # with every check green here. These steps have to mirror the monorepo's
      # .github/workflows/pappardelle.yml or that hole reopens.
      - name: Check formatting (prettier)
        run: bun --bun prettier --check .

      - name: Lint (xo)
        run: bun --bun xo

      - name: Run tests
        run: bun --bun ava 'source/**/*.test.ts'

      - name: Test the compiled CLI after relocation
        env:
          PAPPARDELLE_TEST_STANDALONE: '1'
        run: bun --bun ava --serial source/open-space-command.test.ts

      - name: Verify program status transport, lifecycle, cleanup and app
        run: |
          bun integration-tests/verify-program-status.ts
          bun integration-tests/verify-program-status-lifecycle.ts
          bun integration-tests/verify-program-status-cleanup.ts
          bun integration-tests/verify-program-status-app.ts

  shell-tests:
    name: Shell Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Beads ID prefix matching
        run: ./scripts/test-beads-id-prefixes.sh

      - name: Issue project extraction
        run: ./scripts/test-extract-issue-project.sh

      - name: tmux session name encoding
        run: ./scripts/test-session-name-encoding.sh

      - name: Config layer merge in idow
        run: ./scripts/test-config-layers.sh

      - name: Worktree creation and offline branch reuse
        env:
          GIT_AUTHOR_NAME: Test
          GIT_AUTHOR_EMAIL: test@example.com
          GIT_COMMITTER_NAME: Test
          GIT_COMMITTER_EMAIL: test@example.com
        run: ./scripts/test-create-worktree.sh

      - name: Claude model and effort resolution
        run: ./scripts/test-claude-model-effort.sh

      - name: companion_command resolution
        run: ./scripts/test-companion-command.sh

      # Detection is pointed at a fake Ghostty bundle, so this runs without macOS.
      - name: Terminal launcher resolution
        run: ./scripts/test-terminal-launcher.sh

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pytest
        run: pip install pytest

      - name: Run hook tests
        run: pytest plugins/pappardelle/hooks/ -v
