name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  node-tests:
    name: Node.js Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Formatting and lint are checked here, not just in the monorepo, because
      # sync-back pushes a merged PR's diff *directly to monorepo master* — no
      # PR, no gate. When this workflow only ran ava, a chardigio-side PR could
      # (and did, in #5) land a prettier violation straight onto a red master
      # with every check green here. These steps have to mirror the monorepo's
      # .github/workflows/pappardelle.yml or that hole reopens.
      - name: Check formatting (prettier)
        run: npx prettier --check .

      - name: Lint (xo)
        run: npx xo

      - name: Run tests
        run: npx ava 'source/**/*.test.ts'

  shell-tests:
    name: Shell Tests
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yq
        run: brew install yq

      - name: Beads ID prefix matching
        run: ./scripts/test-beads-id-prefixes.sh

      - name: Issue project extraction
        run: ./scripts/test-extract-issue-project.sh

      - name: tmux session name encoding
        run: ./scripts/test-session-name-encoding.sh

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pytest
        run: pip install pytest

      - name: Run hook tests
        run: pytest hooks/ -v
