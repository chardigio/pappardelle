name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  bun-tests:
    name: Bun Tests (${{ matrix.os }}, sqliteState ${{ matrix.sqlite_state }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # experimental.sqliteState off and on: the files alone, then the
        # database with the files kept beside it and status through the
        # status daemon.
        sqlite_state: ['0', '1']
    runs-on: ${{ matrix.os }}
    env:
      PAPPARDELLE_SQLITE_STATE: ${{ matrix.sqlite_state }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify application tooling does not invoke Node
        run: |
          mkdir -p "$RUNNER_TEMP/no-node"
          cat > "$RUNNER_TEMP/no-node/node" <<'SH'
          #!/bin/sh
          echo "Pappardelle must use Bun, not Node" >&2
          exit 1
          SH
          chmod +x "$RUNNER_TEMP/no-node/node"
          echo "$RUNNER_TEMP/no-node" >> "$GITHUB_PATH"

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Install terminal test tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y tmux shellcheck
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.54.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install terminal test tools (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux shellcheck yq

      # Formatting and lint are checked here, not just in the monorepo, because
      # sync-back pushes a merged PR's diff *directly to monorepo master* — no
      # PR, no gate. When this workflow only ran the unit tests, a chardigio-side PR could
      # (and did, in #5) land a prettier violation straight onto a red master
      # with every check green here. These steps have to mirror the monorepo's
      # .github/workflows/pappardelle.yml or that hole reopens.
      - name: Check formatting (prettier)
        run: bun --bun prettier --check .

      - name: Lint (xo)
        run: bun --bun xo

      - name: Run tests
        run: bun run test:unit

      - name: Test the compiled CLI after relocation
        env:
          PAPPARDELLE_TEST_STANDALONE: '1'
        run: bun run test:unit source/open-space-command.test.ts

      - name: Verify program status transport, lifecycle, cleanup and app
        run: |
          bun integration-tests/verify-program-status.ts
          bun integration-tests/verify-program-status-lifecycle.ts
          bun integration-tests/verify-program-status-cleanup.ts
          bun integration-tests/verify-program-status-app.ts

      - name: Verify the rail over a state database that cannot be read
        run: bun integration-tests/verify-unreadable-state-app.ts

      - name: Verify tmux popups close and release their pty
        run: bun integration-tests/verify-popup-close.ts

      - name: Verify the rail's boxes and row layout
        run: bun integration-tests/verify-rail-boxes.ts

  tmux-floor:
    name: Program status on tmux 3.3a (sqliteState ${{ matrix.sqlite_state }})
    strategy:
      fail-fast: false
      matrix:
        sqlite_state: ['0', '1']
    runs-on: ubuntu-latest
    env:
      PAPPARDELLE_SQLITE_STATE: ${{ matrix.sqlite_state }}
      # The oldest tmux Pappardelle supports: MIN_TMUX_VERSION in
      # source/tmux-version.ts. Move both together.
      TMUX_FLOOR_VERSION: 3.3a
      TMUX_FLOOR_SHA256: e4fd347843bd0772c4f48d6dde625b0b109b7a380ff15db21e97c11a4dcdf93f

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Install build and test tools
        run: sudo apt-get update && sudo apt-get install -y libevent-dev libncurses-dev bison shellcheck

      - name: Build tmux ${{ env.TMUX_FLOOR_VERSION }}
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o tmux.tar.gz "https://github.com/tmux/tmux/releases/download/$TMUX_FLOOR_VERSION/tmux-$TMUX_FLOOR_VERSION.tar.gz"
          echo "$TMUX_FLOOR_SHA256  tmux.tar.gz" | sha256sum -c -
          tar xzf tmux.tar.gz
          cd "tmux-$TMUX_FLOOR_VERSION"
          ./configure --prefix="$RUNNER_TEMP/tmux-floor"
          make -j"$(nproc)"
          make install
          echo "$RUNNER_TEMP/tmux-floor/bin" >> "$GITHUB_PATH"

      - name: Check the tests run tmux ${{ env.TMUX_FLOOR_VERSION }}
        run: test "$(tmux -V)" = "tmux $TMUX_FLOOR_VERSION"

      - name: Verify program status transport, lifecycle, cleanup and app
        run: |
          bun integration-tests/verify-program-status.ts
          bun integration-tests/verify-program-status-lifecycle.ts
          bun integration-tests/verify-program-status-cleanup.ts
          bun integration-tests/verify-program-status-app.ts

  shell-tests:
    name: Shell Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tmux and yq
        run: |
          sudo apt-get update && sudo apt-get install -y tmux
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.54.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Beads ID prefix matching
        run: ./scripts/test-beads-id-prefixes.sh

      - name: Derived issue title
        run: ./scripts/test-derive-title.sh

      - name: Issue project extraction
        run: ./scripts/test-extract-issue-project.sh

      - name: tmux session name encoding
        run: ./scripts/test-session-name-encoding.sh

      - name: Config layer merge in idow
        run: ./scripts/test-config-layers.sh

      - name: Worktree creation and offline branch reuse
        env:
          GIT_AUTHOR_NAME: Test
          GIT_AUTHOR_EMAIL: test@example.com
          GIT_COMMITTER_NAME: Test
          GIT_COMMITTER_EMAIL: test@example.com
        run: ./scripts/test-create-worktree.sh

      - name: Claude model and effort resolution
        run: ./scripts/test-claude-model-effort.sh

      - name: companion_command resolution
        run: ./scripts/test-companion-command.sh

      # Skips where the runner has no systemd user manager.
      - name: Scheduled wake-ups on systemd
        run: ./scripts/test-schedule-systemd.sh

      # Detection is pointed at a fake Ghostty bundle, so this runs without macOS.
      - name: Terminal launcher resolution
        run: ./scripts/test-terminal-launcher.sh

      # Only the portable quoting and viewer rebuild tests run here; the parity
      # half needs osascript.
      - name: Workspace launcher quoting and viewer rebuild
        run: ./scripts/test-workspace-launchers.sh

  python-tests:
    name: Python Tests (sqliteState ${{ matrix.sqlite_state }})
    strategy:
      fail-fast: false
      matrix:
        sqlite_state: ['0', '1']
    runs-on: ubuntu-latest
    env:
      PAPPARDELLE_SQLITE_STATE: ${{ matrix.sqlite_state }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The hook tests ask the CLI to create the state database they write to.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pytest
        run: pip install pytest

      - name: Run hook tests
        run: pytest plugins/pappardelle/hooks/ -v
