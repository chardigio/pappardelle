name: Sync Back to Monorepo

on:
  # `pull_request_target` (not `pull_request`) is required because secrets — in
  # particular `STARDUST_LABS_PAT` — are not exposed to workflows triggered by
  # PRs from forks. This is GitHub's standard fork-secrets gate. We only ever
  # operate on the merged PR's diff *text* (no fork-code execution), and the
  # workflow file itself is read from `main` (the base ref), so a fork can't
  # tamper with the workflow either. See chardigio/pappardelle#3 (synced as
  # STA-944) for the failure mode this guards against.
  pull_request_target:
    types: [closed]
    branches: [main]

jobs:
  sync-back:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Check for forward-sync commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the head commit is checked because forward sync pushes directly
          # to main (not via PR), so the only PRs with [sync] in their head commit
          # would be edge cases like cherry-picks of forward-synced commits.
          HEAD_MSG=$(gh api /repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }} --jq '.commit.message')
          if echo "$HEAD_MSG" | grep -qF 'Synced-from: stardust-labs-io/stardust-labs'; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping: PR contains forward-sync commits"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # Full history, so the next step can diff the commit(s) that the merge
      # put on main. This checks out `main` (our own code), never the PR head.
      - name: Checkout
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync changes to monorepo
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STARDUST_LABS_PAT: ${{ secrets.STARDUST_LABS_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          if [ -z "$STARDUST_LABS_PAT" ]; then
            echo "::error::STARDUST_LABS_PAT secret is not set. Cannot sync back to monorepo."
            exit 1
          fi

          # Get original author info from the PR's head commit
          AUTHOR_NAME=$(gh api /repos/${{ github.repository }}/commits/$HEAD_SHA --jq '.commit.author.name')
          AUTHOR_EMAIL=$(gh api /repos/${{ github.repository }}/commits/$HEAD_SHA --jq '.commit.author.email')

          # Diff what the merge put on main, not the PR's own diff.
          #
          # The PR diff runs from the merge base of the PR branch, so it is
          # stale when main moved after the branch was cut. The monorepo
          # mirrors main, so that stale patch does not apply, and the job
          # fails. That dropped chardigio/pappardelle#40, #41 and #42 (each
          # branched before #36, which touched the same lines), and the next
          # forward sync then erased them from main too; see STA-2708. The
          # change on main always starts from the tree the monorepo holds.
          #
          # The diff comes from local git, not from `gh`: `gh` decorates diffs
          # so `git apply` cannot read them, and it refuses to print a payload
          # that holds terminal escape codes (that broke the sync-back of
          # chardigio/pappardelle#18; see STA-2275).
          #
          # Squash and merge-commit merges put one commit on main, so its first
          # parent is the old main. A rebase merge puts the PR's N commits on
          # main, so the old main is N commits back. We know it was a rebase
          # when the last N subjects on main match the PR's commit subjects.
          BASE="$MERGE_SHA^1"
          PARENT_COUNT=$(($(git rev-list --parents -n1 "$MERGE_SHA" | wc -w) - 1))
          if [ "$PARENT_COUNT" -eq 1 ] && [ "$PR_COMMITS" -gt 1 ]; then
            PR_SUBJECTS=$(gh api --paginate "/repos/${{ github.repository }}/pulls/$PR_NUMBER/commits" --jq '.[].commit.message | split("\n")[0]')
            MAIN_SUBJECTS=$(git log --first-parent --reverse --format=%s -n "$PR_COMMITS" "$MERGE_SHA")
            if [ "$PR_SUBJECTS" = "$MAIN_SUBJECTS" ]; then
              BASE="$MERGE_SHA~$PR_COMMITS"
              echo "Rebase merge: diffing the last $PR_COMMITS commits on main"
            fi
          fi
          git diff --binary "$BASE" "$MERGE_SHA" > /tmp/pr.diff

          if [ ! -s /tmp/pr.diff ]; then
            echo "Empty diff, nothing to sync"
            exit 0
          fi

          # Clone stardust-labs monorepo (shallow)
          git clone --depth=1 "https://x-access-token:${STARDUST_LABS_PAT}@github.com/stardust-labs-io/stardust-labs.git" /tmp/monorepo
          cd /tmp/monorepo

          # Apply the diff under the pappardelle directory
          git apply --directory=_dev/scripts/pappardelle /tmp/pr.diff || {
            echo "::error::git apply failed — the monorepo may have diverged. See _docs/2026-03-11-pappardelle-bidirectional-sync.md for manual fallback steps."
            exit 1
          }

          # Commit with original author attribution
          git config user.name "pappardelle-sync[bot]"
          git config user.email "pappardelle-sync[bot]@users.noreply.github.com"

          git add -A
          GIT_AUTHOR_NAME="$AUTHOR_NAME" \
          GIT_AUTHOR_EMAIL="$AUTHOR_EMAIL" \
          git commit -m "$PR_TITLE (chardigio/pappardelle#$PR_NUMBER)"

          # Two PRs merged close together run this job at the same time, so
          # master can move between our clone and our push. Rebase and retry.
          for attempt in 1 2 3 4 5; do
            git push origin master && break
            if [ "$attempt" -eq 5 ]; then
              echo "::error::git push failed 5 times. See _docs/2026-03-11-pappardelle-bidirectional-sync.md for manual fallback steps."
              exit 1
            fi
            git pull --rebase --depth=50 origin master
          done
          echo "Successfully synced PR #$PR_NUMBER to stardust-labs monorepo"
