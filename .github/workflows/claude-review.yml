# Claude PR review (https://github.com/sddamico/claude-review). No secrets: the
# job signs in to Anthropic with its GitHub identity token, matched by the
# federation rule below.
name: Claude review

on:
  # pull_request_target runs this file from the base branch with secrets
  # available, so PRs from forks get reviewed too. It is safe here because the
  # job never checks out or runs the PR's code on the runner; the code is only
  # read inside Anthropic's sandbox.
  pull_request_target:
    types: [opened, reopened, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Reviews start on their own for PRs from the owner, org members, and
    # collaborators. Anyone else's PR is reviewed when a maintainer adds the
    # "claude-review" label, which is also how to ask for a fresh review.
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'claude-review') ||
      (github.event.action != 'labeled' && !github.event.pull_request.draft &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: sddamico/claude-review@main
        with:
          anthropic-federation-rule-id: fdrl_01WVxMn1oPkYEh13DtYcBgd7
          # The action adds the "**<severity>:**" label and the validation
          # line to each comment itself, so a body that also starts with the
          # label shows it two times. These rules control only how the agent
          # turns the /code-review output into comments. GitHub rejects the
          # whole review when one comment points outside the diff, and the
          # action then puts every finding in one long body (PR #48), so the
          # line check below matters most.
          extra-instructions: |
            Choose the inline comments like this:
            - An inline comment's line, and its start_line when set, must be inside a hunk of pr.diff (an added line or a context line that the hunk shows). Before you write the file, check each one against the "@@ -a,b +c,d @@" ranges for its file. Put a finding on any other line in the summary.
            - Only a finding with the verdict "valid" is an inline comment. Put a finding with any other verdict in the summary.
            Format each inline comment like this:
            - Do not start the body with the severity ("bug:", "risk:", "nit:"), in bold or not. The action adds that label.
            - Start with one bold sentence that states the problem. Then give the failure scenario and the fix in two or three short sentences, with no "Failure:" or "Fix:" headings. Do not repeat the file name or line number.
            - When the fix is a direct edit of the lines that the comment covers, add a GitHub suggestion block (```suggestion) after the text. The block replaces lines start_line through line (or only line) in full, so it must hold every one of those lines as they must read after the fix, with the same indentation, and nothing else. Set start_line when the fix covers more than one line. Do not add a suggestion block when the fix touches other lines or files, or when you are not sure that it is correct.
            Format the summary like this:
            - One or two sentences. Do not repeat or list the findings that are inline comments.
            - Give each finding that is not an inline comment as one bullet of one line: `path:line`, the problem in a few words, and the verdict in parentheses. Do not add the failure scenario or the verdict reason.
            - In the "Earlier findings" list, show only the findings that are still open, each in a few words. Give the number that are fixed or no longer relevant as one line.
